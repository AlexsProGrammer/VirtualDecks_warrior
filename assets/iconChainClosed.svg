<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="white">
  <!-- Closed/locked chain icon: two connected links forming a chain -->
  <!-- Left link (elliptical) -->
  <ellipse cx="7" cy="9" rx="2.5" ry="3.5" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right link (elliptical) -->
  <ellipse cx="17" cy="9" rx="2.5" ry="3.5" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Connecting bridge - horizontal line at middle -->
  <line x1="9.5" y1="9" x2="14.5" y2="9" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
